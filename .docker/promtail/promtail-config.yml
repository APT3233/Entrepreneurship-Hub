server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - target_label: job
        replacement: docker
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/*-json.log
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}
      - drop:
          older_than: 336h
          drop_counter_reason: too_old
      - match:
          selector: '{compose_service="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
                  request: request
                  request_time: request_time
            - regex:
                source: request
                expression: "^(?P<method>\\S+) (?P<path>\\S+) (?P<protocol>\\S+)$"
            - labels:
                status:
                method:
      - match:
          selector: '{compose_service="ehub-server"}'
          stages:
            - json:
                expressions:
                  level: level
                  http_status: http_status
                  http_method: http_method
                  trace_id: trace_id
            - labels:
                level:
                http_status:
                http_method:
      - match:
          selector: '{compose_service="mysql"}'
          stages:
            - regex:
                expression: "\\[(?P<level>System|Warning|Error|Note)\\]"
            - labels:
                level:
