# .docker/nginx/conf.d/ehub.conf

server {
    listen 80;
    listen [::]:80;
    server_name ehub.apt3233.id.vn _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ehub.apt3233.id.vn _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    set $ehub_client http://ehub-client:80;
    set $ehub_server http://ehub-server:7777;
    set $ehub_minio http://minio:9000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $ehub_server;
    }

    location /ehub/ {
        include /etc/nginx/snippets/minio-proxy-params.conf;
        proxy_pass $ehub_minio;
    }

    location /ehubd/ {
        include /etc/nginx/snippets/minio-proxy-params.conf;
        proxy_pass $ehub_minio;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $ehub_client;
    }
}
