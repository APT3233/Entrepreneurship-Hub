# .docker/nginx/conf.d/gateway.conf — 9router public gateway

server {
    listen 80;
    listen [::]:80;
    server_name gateway.apt3233.id.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gateway.apt3233.id.vn;

    ssl_certificate     /etc/nginx/certs/gateway-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/gateway-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    set $ninerouter http://ninerouter:20128;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $ninerouter;
    }
}
