# .docker/nginx/snippets/minio-proxy-params.conf
#
# Presigned S3 URLs include the Host header in the signature, so keep
# $http_host exactly as the browser sends it, including the port.

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

add_header Access-Control-Allow-Origin $cors_allow_origin always;
add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
add_header Access-Control-Expose-Headers "ETag, X-Amz-Request-Id, X-Amz-Id-2" always;
add_header Vary "Origin" always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary "Origin" always;
    add_header Content-Length 0;
    return 204;
}

proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
