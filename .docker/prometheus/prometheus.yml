global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets:
          - promtail:9080

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: host

  - job_name: docker-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - docker-metrics:9273
        labels:
          service: docker

  - job_name: nginx-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx-exporter:9113
        labels:
          service: nginx

  - job_name: mysql-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - mysql-exporter:9104
        labels:
          service: mysql
