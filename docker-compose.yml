name: ehub

services:
  nginx:
    image: nginx:alpine
    container_name: ehub-nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./.docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - ehub-server
      - ehub-client
      - minio
    networks:
      - ehub-network

  mysql:
    image: mysql:8.0
    container_name: ehub-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-fptu_ehub_db}
      MYSQL_USER: ${MYSQL_USER:-fptu_ehub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fptu_ehub_passwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./workdir/database/fptu_ehub_structure_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # - ./workdir/database/init_data_lec1.sql:/docker-entrypoint-initdb.d/init_data_lec1.sql:ro
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=64M"
      - "--max-connections=30"
      - "--skip-log-bin"
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-fptu_ehub_user}", "-p${MYSQL_PASSWORD:-fptu_ehub_passwd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ehub-network

  redis:
    image: redis:7-alpine
    container_name: ehub-redis
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./ehub-server/scripts/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    mem_limit: 96m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ehub-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: ehub-minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port (Giao diện web)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data:/data                   
    command: server /data --console-address ":9001"
    restart: always
    mem_limit: 2048m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ehub-network

  ollama:
    build:
      context: ./.docker/ollama
    image: ehub-ollama:latest
    container_name: ehub-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PULL_MODEL=${OLLAMA_PULL_MODEL:-gemma3:4b}
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    networks:
      - ehub-network

  ehub-server:
    build:
      context: ./ehub-server
      args:
        APP_PORT: ${APP_PORT:-7777}
    container_name: ehub-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7777}:${APP_PORT:-7777}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-7777}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-fptu_ehub_db}
      MYSQL_USER: ${MYSQL_USER:-fptu_ehub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fptu_ehub_passwd}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-5173}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      LOG_FORMAT: json
      LOG_SERVICE: ehub-server
      AI_WORKER_ENABLED: "false"
      AI_WORKER_MAX_ATTEMPTS: ${AI_WORKER_MAX_ATTEMPTS:-3}
      AI_WORKER_STALE_PROCESSING_MINUTES: ${AI_WORKER_STALE_PROCESSING_MINUTES:-15}
      AI_BULLMQ_QUEUE_NAME: ${AI_BULLMQ_QUEUE_NAME:-ai-evaluation}
      AI_BULLMQ_BACKFILL_MS: ${AI_BULLMQ_BACKFILL_MS:-30000}
      AI_MAX_CONCURRENT_JOBS: ${AI_MAX_CONCURRENT_JOBS:-2}
      OUTBOX_WORKER_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ehub-network

  ehub-mail-worker:
    build:
      context: ./ehub-server
      args:
        APP_PORT: ${APP_PORT:-7777}
    container_name: ehub-mail-worker
    restart: unless-stopped
    command: ["node", "app/workers/mailOutbox.entry.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-fptu_ehub_db}
      MYSQL_USER: ${MYSQL_USER:-fptu_ehub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fptu_ehub_passwd}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      LOG_FORMAT: json
      LOG_SERVICE: ehub-mail-worker
      OUTBOX_WORKER_ENABLED: "true"
      OUTBOX_WORKER_IN_API: "false"
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      OUTBOX_STALE_PROCESSING_MINUTES: ${OUTBOX_STALE_PROCESSING_MINUTES:-15}
      MAIL_INVITE_MAX_ATTEMPTS: ${MAIL_INVITE_MAX_ATTEMPTS:-5}
      MAIL_INVITE_CONCURRENCY: ${MAIL_INVITE_CONCURRENCY:-10}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ehub-network

  ehub-ai-worker:
    build:
      context: ./ehub-server
      args:
        APP_PORT: ${APP_PORT:-7777}
    container_name: ehub-ai-worker
    restart: unless-stopped
    command: ["node", "app/workers/aiEvaluation.entry.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-fptu_ehub_db}
      MYSQL_USER: ${MYSQL_USER:-fptu_ehub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fptu_ehub_passwd}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      LOG_FORMAT: json
      LOG_SERVICE: ehub-ai-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ehub-network

  ehub-client:
    build:
      context: ./ehub-client
      dockerfile: Dockerfile
    container_name: ehub-client
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - ehub-server
    networks:
      - ehub-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  ehub-network:
    driver: bridge
